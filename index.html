<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f3"><title>陽光中醫｜示範系統</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#253e32;font-family:system-ui,-apple-system,sans-serif;line-height:1.6}header{height:66px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:.1em;background:#fff;border-bottom:1px solid #e4ebe3}header img{width:42px;height:42px;object-fit:contain}main{max-width:560px;margin:auto;padding:20px 20px 120px}.banner{background:#fff3d9;color:#795815;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:700}.hero{background:#e8f0e8;border-radius:20px;padding:24px;margin:18px 0}.eyebrow{font-size:12px;color:#668172;letter-spacing:.12em}h1{font-size:27px;line-height:1.3;margin:7px 0 10px}h2{font-size:20px;margin:26px 0 12px}h3{font-size:16px;margin:0 0 7px}p{margin:7px 0;color:#61766a;font-size:14px}.card{background:white;border:1px solid #e1eae1;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action,button{font:inherit;cursor:pointer}button{border:0;border-radius:12px;background:#426b57;color:white;padding:12px 16px;font-weight:700}.action{background:#fff;border:1px solid #dce7dd;color:#426b57;text-align:left;min-height:70px}.secondary{background:#eaf1ea;color:#426b57}.danger{background:#fff0ed;color:#a44838}.wide{width:100%;margin-top:16px}label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}input,select{font:inherit;width:100%;border:1px solid #d8e2d9;border-radius:10px;background:white;padding:12px;color:#253e32;min-height:48px}.small{font-size:12px;color:#74877b}.tag{display:inline-block;background:#e8f0e8;color:#426b57;border-radius:20px;padding:3px 10px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row button{flex:none}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid #dfe8df;padding:7px 0 calc(7px + env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:#83948a;border-radius:8px;padding:5px 2px;font-size:11px;flex:1;max-width:112px}.nav button span{display:block;font-size:20px;line-height:1.3}.nav button.active{color:#426b57;background:#eef5ef}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:380px}th,td{padding:10px 7px;text-align:left;border-bottom:1px solid #e8eee8}th{color:#61766a}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{background:#edf3ed;color:#426b57;font-size:13px;padding:8px 13px}.filters button.active{background:#426b57;color:white}.article-button{width:100%;text-align:left;color:inherit;background:white;border:1px solid #e1eae1;margin:8px 0;padding:16px}.article-button strong{display:block}.article-button span{font-weight:400;font-size:13px;color:#718578}.back{background:transparent;color:#426b57;padding:4px 0}.assistant-button{position:fixed;right:16px;bottom:82px;display:flex;align-items:center;gap:5px;padding:5px 13px 5px 5px;border-radius:40px;box-shadow:0 5px 20px #203b2e33;z-index:6}.assistant-button img{width:38px;height:38px;object-fit:contain}.assistant-panel{position:fixed;right:16px;bottom:145px;width:min(350px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:white;border:1px solid #d8e2d9;border-radius:20px;box-shadow:0 10px 40px #203b2e33;z-index:7;padding:18px}.assistant-panel img{width:50px;vertical-align:middle}.assistant-panel .question{display:block;width:100%;text-align:left;margin-top:8px;background:#f0f5ef;color:#426b57;font-size:13px}.answer{background:#f7f8f3;border-radius:10px;padding:12px;margin-top:12px;font-size:13px}.close{background:transparent;color:#426b57;font-size:22px;padding:0 6px}[hidden]{display:none!important}a{color:#426b57}dialog{border:0;border-radius:18px;padding:24px;max-width:340px;width:calc(100% - 40px);color:#253e32;box-shadow:0 10px 50px #0003}dialog::backdrop{background:#203b2e88}.dialog-actions{display:flex;gap:10px;margin-top:18px}.dialog-actions button{flex:1}
</style></head><body><header><img src="sun-logo.png" alt=""><span>陽光中醫</span></header><main><div class="banner">示範系統，未連接診所。請只填寫虛構資料。</div><div id="screen"></div></main><nav class="nav" aria-label="主要導覽"><button data-page="home"><span>⌂</span>首頁</button><button data-page="book"><span>✚</span>線上掛號</button><button data-page="progress"><span>◷</span>看診進度</button><button data-page="health"><span>❋</span>健康專區</button><button data-page="mine"><span>♙</span>我的</button></nav><button class="assistant-button" id="assistant-open" aria-expanded="false" aria-controls="assistant-panel"><img src="assistant-c.png" alt="">小C 助理</button><aside class="assistant-panel" id="assistant-panel" hidden aria-label="小C 助理"><div class="row"><strong><img src="assistant-c.png" alt=""> 小C 助理</strong><button class="close" id="assistant-close" aria-label="關閉小C">×</button></div><p>您好！我是小C，可以協助您了解示範系統。</p><button class="question" data-answer="選擇醫師、日期和時段，填寫虛構姓名及聯絡電話後即可完成示範掛號。">如何掛號？</button><button class="question" data-answer="到「我的」查看示範掛號，點選取消後再確認即可。">如何取消掛號？</button><button class="question" data-answer="看診進度為模擬資料，不代表真實診所的即時狀況。">看診進度是真的嗎？</button><div class="answer" id="assistant-answer" aria-live="polite">請選擇上方問題，我會為您說明。</div><p class="small">小C提供固定示範回答，無法提供醫療診斷。</p></aside><dialog id="cancel-dialog"><h3>確認取消掛號？</h3><p>取消後，這筆示範預約將標示為已取消。</p><div class="dialog-actions"><button class="secondary" id="cancel-back">返回</button><button class="danger" id="cancel-confirm">確認取消</button></div></dialog><script>
// Data access is isolated here so a clinic API can replace localStorage later.
const store={key:'sunshine-demo-bookings-v1',read(){try{const d=JSON.parse(localStorage.getItem(this.key)||'[]');return Array.isArray(d)?d:[]}catch{return []}},write(data){localStorage.setItem(this.key,JSON.stringify(data))}};
const doctors=[{id:'lin',name:'林安和 醫師',specialty:'內科調理、睡眠保健',intro:'重視生活習慣與身心平衡，以耐心溝通了解需求。',sessions:'週一上午、週三下午、週五晚上',days:[1,3,5],slots:{1:['上午 09:00'],3:['下午 14:00'],5:['晚上 18:30']}},{id:'chen',name:'陳晴芳 醫師',specialty:'婦科調理、體質調養',intro:'關注不同人生階段的健康需求，提供個別化照護。',sessions:'週二上午、週四下午、週六上午',days:[2,4,6],slots:{2:['上午 09:00'],4:['下午 14:00'],6:['上午 09:00']}},{id:'huang',name:'黃子謙 醫師',specialty:'傷科調理、肌肉關節保健',intro:'關注日常活動與身體機能，協助了解保健方向。',sessions:'週一下午、週三晚上、週五上午',days:[1,3,5],slots:{1:['下午 14:00'],3:['晚上 18:30'],5:['上午 09:00']}}];
const articles=[{id:'sleep',category:'生活保健',title:'日常作息，從規律開始',summary:'從睡眠、飲食與活動照顧自己的每一天。',body:'保持規律睡眠、適度活動與均衡飲食，有助於照顧日常健康。可以從固定起床時間開始，逐步建立適合自己的生活節奏。若有持續不適，請尋求醫師評估。'},{id:'visit',category:'就診準備',title:'就診前可以準備什麼？',summary:'整理症狀與問題，讓看診溝通更順暢。',body:'就診前可以整理症狀出現的時間、變化，以及目前使用的藥物。將想詢問醫師的問題記下來，也有助於在有限時間內充分溝通。'},{id:'move',category:'生活保健',title:'讓活動融入日常',summary:'從容易持續的小步驟開始。',body:'依自己的身體狀況選擇適合的活動，例如散步或溫和伸展。循序漸進，並留意身體反應；如有疼痛或不適，請停止活動並諮詢醫療人員。'}];
const screen=document.querySelector('#screen');let page='home',filter='全部',pendingCancel=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dayNames=['日','一','二','三','四','五','六'];const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const upcoming=()=>store.read().filter(b=>b.status==='預約成功'&&b.date>=localDate(new Date())).sort((a,b)=>a.date.localeCompare(b.date));
function bookingCard(b){return `<div class="card"><div class="row"><strong>${esc(b.doctor)}</strong><span class="tag">${esc(b.status)}</span></div><p>${esc(b.date)}・${esc(b.slot)}</p><p>示範號碼 ${esc(b.number)} 號</p>${b.status==='預約成功'?`<button class="danger" data-cancel="${esc(b.id)}">取消掛號</button>`:''}</div>`}
function home(){const next=upcoming()[0];return `<div class="hero"><div class="eyebrow">用心照顧，從容就醫</div><h1>陪伴您，照顧每一天</h1><p>陽光中醫致力於提供溫暖、細心的中醫照護。此頁為操作展示，診所與醫師資訊皆為示範。</p></div><div class="grid"><button class="action" data-go="book">✚　線上掛號<br><span class="small">選擇看診時間</span></button><button class="action" data-go="progress">◷　看診進度<br><span class="small">查看模擬號碼</span></button></div><h2>最新公告</h2><div class="card"><span class="tag">示範公告</span><h3>歡迎使用陽光中醫展示系統</h3><p>您可以體驗掛號、查詢與取消流程；所有資料均為示範。</p></div><h2>近期預約</h2>${next?bookingCard(next):'<div class="card"><p>目前沒有即將到來的示範預約。</p><button class="secondary" data-go="book">前往掛號</button></div>'}<div class="grid"><button class="action" data-go="schedule">▦　門診時間</button><button class="action" data-go="doctors">✣　醫師介紹</button><button class="action" data-go="clinic">⌖　診所資訊</button><button class="action" data-go="mine">♙　我的掛號</button></div>`}
function book(){return `<h1>線上掛號</h1><p>選擇示範醫師與看診時間，請勿填寫真實個資。</p><form id="booking" class="card"><label for="doctor">選擇醫師</label><select id="doctor" required><option value="">請選擇醫師</option>${doctors.map(d=>`<option value="${d.id}">${d.name}｜${d.specialty}</option>`).join('')}</select><label for="date">看診日期</label><input id="date" type="date" min="${localDate(new Date())}" required><p id="availability" class="small">請先選擇醫師與日期。</p><label for="slot">看診時段</label><select id="slot" required><option value="">請先選擇醫師與日期</option></select><label for="name">姓名（請填虛構資料）</label><input id="name" required maxlength="40" placeholder="例如：王小明" autocomplete="off"><label for="phone">聯絡電話（請填虛構資料）</label><input id="phone" type="tel" required pattern="09[0-9]{8}" title="請輸入 09 開頭的 10 碼示範電話" placeholder="09 開頭，共 10 碼" autocomplete="off"><button class="wide" type="submit">確認示範掛號</button><p class="small">示範預約僅儲存在這個瀏覽器，不會傳送至診所或寄送郵件。</p></form>`}
function progress(){const b=upcoming()[0];return `<h1>看診進度</h1><div class="banner">模擬資料，非真實即時資訊，也未連接診所。</div><p>以下號碼僅供介面展示，不會隨診所狀況更新。</p>${[{room:'第一診間',doctor:'林安和 醫師',num:12},{room:'第二診間',doctor:'陳晴芳 醫師',num:8},{room:'第三診間',doctor:'黃子謙 醫師',num:16}].map(x=>`<div class="card"><div class="row"><div><h3>${x.room}</h3><p>${x.doctor}</p></div><div>目前號碼<br><strong style="font-size:24px">${x.num} 號</strong></div></div><p class="small">狀態：模擬看診中</p></div>`).join('')}<div class="card"><h3>我的號碼</h3>${b?`<p>${esc(b.doctor)}・${esc(b.date)} ${esc(b.slot)}</p><strong>${esc(b.number)} 號</strong><p>狀態：示範預約成功，實際進度未連接</p>`:'<p>目前沒有即將到來的示範預約。</p><button class="secondary" data-go="book">前往掛號</button>'}<p class="small">模擬資料更新時間：2026/11/02 09:00（固定示範時間）</p></div>`}
function schedule(){return `<button class="back" data-go="home">‹ 返回首頁</button><h1>門診時間</h1><p>以下為示範門診表，日期與時段並非真實資訊。</p><div class="card table-wrap"><table><thead><tr><th>星期</th><th>上午</th><th>下午</th><th>晚上</th></tr></thead><tbody><tr><th>週一</th><td>林安和</td><td>黃子謙</td><td>—</td></tr><tr><th>週二</th><td>陳晴芳</td><td>—</td><td>—</td></tr><tr><th>週三</th><td>—</td><td>林安和</td><td>黃子謙</td></tr><tr><th>週四</th><td>—</td><td>陳晴芳</td><td>—</td></tr><tr><th>週五</th><td>黃子謙</td><td>—</td><td>林安和</td></tr><tr><th>週六</th><td>陳晴芳</td><td>—</td><td>—</td></tr><tr><th>週日</th><td colspan="3">休診</td></tr></tbody></table><p class="small">上午 09:00、下午 14:00、晚上 18:30 為示範時段。</p></div><button class="wide" data-go="book">前往線上掛號</button>`}
function doctorPage(){return `<button class="back" data-go="home">‹ 返回首頁</button><h1>醫師介紹</h1><p>以下醫師與資訊均為虛構示範。</p>${doctors.map(d=>`<div class="card"><h3>${d.name}</h3><span class="tag">${d.specialty}</span><p>${d.intro}</p><p>可掛號時段：${d.sessions}</p><button class="secondary" data-book-doctor="${d.id}">選擇此醫師掛號</button></div>`).join('')}`}
function health(){return `<h1>健康專區</h1><p>一般健康資訊不能取代個人醫療建議。</p><div class="filters">${['全部','生活保健','就診準備'].map(f=>`<button class="${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div>${articles.filter(a=>filter==='全部'||a.category===filter).map(a=>`<button class="article-button" data-article="${a.id}"><span>${a.category}</span><strong>${a.title}　›</strong><span>${a.summary}</span></button>`).join('')}`}
function article(id){const a=articles.find(x=>x.id===id);if(!a)return health();return `<button class="back" data-go="health">‹ 返回文章列表</button><p><span class="tag">${a.category}</span></p><h1>${a.title}</h1><div class="card"><p>${a.body}</p><p class="small">此文章為示範內容，不能取代個人醫療建議。</p></div>`}
function clinic(){return `<button class="back" data-go="home">‹ 返回首頁</button><h1>診所資訊</h1><p>以下地址、電話與交通資訊皆為虛構示範。</p><div class="card"><h3>地址與電話</h3><p>示範市陽光區健康路 100 號</p><p>電話：02-0000-0000（示範號碼）</p></div><div class="card"><h3>交通方式</h3><p>示範：搭乘大眾運輸至「陽光站」，步行約 5 分鐘。</p></div><div class="card"><h3>初診須知</h3><p>請依實際診所要求準備證件，並事先整理症狀與用藥資訊。此展示系統不會建立實際掛號。</p></div><div class="card"><h3>常見問題</h3><details><summary>示範掛號會傳送到診所嗎？</summary><p>不會。紀錄僅儲存在目前瀏覽器。</p></details><details><summary>如何取消示範預約？</summary><p>至「我的」找到該筆預約，點選取消並確認。</p></details></div>`}
function mine(){const all=store.read().slice().reverse();return `<h1>我的</h1><h2>我的掛號</h2><p>預約紀錄僅儲存在此瀏覽器，清除瀏覽器資料後可能消失。</p>${all.length?all.map(bookingCard).join(''):'<div class="card"><h3>尚無預約紀錄</h3><p>完成示範掛號後，紀錄會顯示在這裡。</p><button class="secondary" data-go="book">前往掛號</button></div>'}<h2>更多資訊</h2><div class="grid"><button class="action" data-go="schedule">門診時間</button><button class="action" data-go="doctors">醫師介紹</button><button class="action" data-go="clinic">診所資訊</button></div>`}
function render(view=page){page=view;const active=['schedule','doctors','clinic'].includes(view)?'home':view.startsWith('article:')?'health':view;document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===active);if(b.dataset.page===active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});screen.innerHTML=view==='home'?home():view==='book'?book():view==='progress'?progress():view==='schedule'?schedule():view==='doctors'?doctorPage():view==='clinic'?clinic():view==='health'?health():view.startsWith('article:')?article(view.slice(8)):mine();window.scrollTo(0,0);if(view==='book')setupBooking()}
function setupBooking(){const form=document.querySelector('#booking'),doctor=form.querySelector('#doctor'),date=form.querySelector('#date'),slot=form.querySelector('#slot'),availability=form.querySelector('#availability');function update(){const d=doctors.find(x=>x.id===doctor.value);const day=date.value?new Date(date.value+'T12:00:00').getDay():null;const slots=d&&day!==null?(d.slots[day]||[]):[];slot.innerHTML='<option value="">'+(slots.length?'請選擇時段':'此日期無示範門診')+'</option>'+slots.map(s=>`<option>${s}</option>`).join('');availability.textContent=d&&date.value?(slots.length?`週${dayNames[day]}有示範門診。`:`該醫師此日期沒有示範門診；${d.sessions}。`):'請先選擇醫師與日期。'}doctor.addEventListener('change',update);date.addEventListener('change',update);form.addEventListener('submit',e=>{e.preventDefault();const n=form.querySelector('#name').value.trim(),phone=form.querySelector('#phone').value.trim();if(!n){form.querySelector('#name').setCustomValidity('請填寫虛構姓名');form.reportValidity();return}form.querySelector('#name').setCustomValidity('');const d=doctors.find(x=>x.id===doctor.value);if(!d||!slot.value)return;const records=store.read(),number=20+records.length%70;const b={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),doctor:d.name,date:date.value,slot:slot.value,name:n,phone,status:'預約成功',number};try{records.push(b);store.write(records)}catch{alert('無法儲存示範預約，請檢查瀏覽器的儲存設定。');return}screen.innerHTML=`<h1>示範掛號完成</h1><div class="card"><span class="tag">✓ 預約成功</span><h2>您的示範掛號已建立</h2><p>${esc(b.doctor)}｜${esc(b.date)}｜${esc(b.slot)}</p><p>姓名：${esc(b.name)}　示範號碼：${b.number} 號</p><p>此為示範系統，未連接診所，不會寄送郵件或完成實際掛號。</p><button class="wide" data-go="mine">查看我的掛號</button><button class="wide secondary" data-go="home">返回首頁</button></div>`});form.querySelector('#name').addEventListener('input',e=>e.target.setCustomValidity(''))}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.page)render(t.dataset.page);else if(t.dataset.go)render(t.dataset.go);else if(t.dataset.filter){filter=t.dataset.filter;render('health')}else if(t.dataset.article)render('article:'+t.dataset.article);else if(t.dataset.bookDoctor){render('book');document.querySelector('#doctor').value=t.dataset.bookDoctor;document.querySelector('#doctor').dispatchEvent(new Event('change'))}else if(t.dataset.cancel){pendingCancel=t.dataset.cancel;document.querySelector('#cancel-dialog').showModal()}});
document.querySelector('#cancel-back').onclick=()=>document.querySelector('#cancel-dialog').close();document.querySelector('#cancel-confirm').onclick=()=>{const records=store.read(),b=records.find(x=>x.id===pendingCancel);if(b){b.status='已取消';try{store.write(records)}catch{alert('無法儲存取消結果，請檢查瀏覽器的儲存設定。');return}}document.querySelector('#cancel-dialog').close();pendingCancel=null;render('mine');const msg=document.createElement('div');msg.className='banner';msg.setAttribute('role','status');msg.textContent='已取消此筆示範掛號。';screen.prepend(msg)};
const open=document.querySelector('#assistant-open'),panel=document.querySelector('#assistant-panel');function setAssistant(v){panel.hidden=!v;open.setAttribute('aria-expanded',String(v));if(v)document.querySelector('#assistant-close').focus();else open.focus()}open.onclick=()=>setAssistant(panel.hidden);document.querySelector('#assistant-close').onclick=()=>setAssistant(false);document.querySelectorAll('.question').forEach(b=>b.onclick=()=>document.querySelector('#assistant-answer').textContent=b.dataset.answer);render();
</script></body></html>
